<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>QR校内探検マップ</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: #f0f0f0; display: flex; justify-content: center; align-items: center;
    overflow: hidden; position: relative; user-select: none; -webkit-user-select: none;
}
#map-wrapper { position: relative; display: flex; justify-content: center; align-items: center; max-width: 100vw; max-height: 100vh; }
#map-area { position: relative; display: inline-block; }
#map-image { display: block; max-width: 100vw; max-height: 100vh; width: auto; height: auto; object-fit: contain; cursor: pointer; }
#stamps-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

.stamp {
    position: absolute; width: 32px; height: 32px; border-radius: 50%;
    transform: translate(-50%, -50%); cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    pointer-events: auto; z-index: 10;
}

@keyframes heartBeat {
  0% { transform: translate(-50%, -50%) scale(1); }
  25% { transform: translate(-50%, -50%) scale(1.3); }
  50% { transform: translate(-50%, -50%) scale(1); }
  75% { transform: translate(-50%, -50%) scale(1.2); }
  100% { transform: translate(-50%, -50%) scale(1); }
}
.stamp.not-found-animate {
    animation: heartBeat 0.4s linear;
}

/* 💡 cursor: pointer を追加して、触れば閉じることが直感的に伝わるように */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background-color:rgba(0,0,0,0.8);z-index:200;justify-content:center;align-items:center;flex-direction:column;color:white;cursor:pointer;}
.modal img{max-width:80%;max-height:70%;border:5px solid white;border-radius:10px;object-fit:contain;}
.modal h2{margin-top:15px;font-size:24px;}

#camera-container {
    display: none; position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%); width: 280px; height: 280px;
    background: #000; border: 4px solid #3498db; border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 300;
    overflow: hidden; flex-direction: column; justify-content: center; align-items: center;
}
#webcam-video { width: 100%; height: 100%; object-fit: cover; }
#qrcode-popup{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:25px;border-radius:15px;box-shadow:0 0 30px rgba(0,0,0,0.5);z-index:400;text-align:center;color:black;width:85%;max-width:320px;}
#qrcode-canvas img { max-width: 100%; height: auto; margin: 15px auto; display: block; }
.admin-edit-popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); z-index: 500; text-align: center; color: black; width: 280px; }
.admin-edit-popup button { margin: 6px; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; width: 80%; font-size: 14px; }
.close-btn-admin{margin-top:15px;padding:10px 20px;background-color:#ff6666;color:white;border:none;border-radius:50px;font-size:18px;cursor:pointer;}
</style>
</head>
<body class="children-mode">

<div id="map-wrapper">
    <div id="map-area">
        <img id="map-image" src="map.png" alt="校内マップ" onerror="this.style.display='none'; alert('map.png が見つかりません。');">
        <div id="stamps-container"></div>
    </div>
</div>

<button id="camera-button" 
        style="user-select: none; -webkit-user-select: none;"
        onmousedown="startCamera()" 
        onmouseup="stopCamera()" 
        onmouseleave="stopCamera()"
        ontouchstart="startCamera(event)" 
        ontouchend="stopCamera(event)">カ<br>メ<br>ラ</button>

<div id="admin-panel">
<h3>【先生用】設定モード</h3>
<p>マップをタップしてピンを配置できます</p>
<button id="save-settings-btn" onclick="generateAdminQR()">📱 配布用マスターQRコードを作る</button>
</div>

<div id="qrcode-popup">
    <h3>子どもたちに読み込ませるQRコード</h3>
    <p style="font-size:13px; color:#555;">このQRを児童のカメラで読み取ると、マップのピンが一瞬で復元します！</p>
    <div id="qrcode-canvas"></div>
    <button class="close-btn-admin" style="background:#444;" onclick="closeQRPopup()">とじる</button>
</div>

<div id="admin-edit-popup" class="admin-edit-popup">
    <h3 id="edit-popup-title">ピンの確認</h3>
    <p id="edit-popup-info" style="font-weight:bold; color:#2c3e50; font-size:18px;"></p>
    <p style="font-size:12px; color:#7f8c8d;">この教室の写真は「（上の番号）.jpg」という名前でGitHubに保存してください。</p>
    <button onclick="deletePin()" style="background:#e74c3c; color:white;">このピンを削除する</button><br>
    <button onclick="closeEditPopup()" style="background:#7f8c8d; color:white;">とじる</button>
</div>

<div id="room-modal" class="modal" onclick="closeModal()">
<img id="modal-image" src="" alt="教室の様子">
<h2 id="modal-title">みつけたよ！</h2>
</div>

<div id="camera-container">
    <video id="webcam-video" autoplay playsinline></video>
    <canvas id="qr-canvas" hidden></canvas>
</div>

<script>
let isAdmin = false;
let pinPositions = [];
let myStamps = [];
let selectedPinIndex = null;

const STORAGE_KEY_PINS = 'school_qr_pins';
const STORAGE_KEY_STAMPS = 'school_qr_stamps';

if (localStorage.getItem(STORAGE_KEY_PINS)) {
    pinPositions = JSON.parse(localStorage.getItem(STORAGE_KEY_PINS));
}
if (localStorage.getItem(STORAGE_KEY_STAMPS)) {
    myStamps = JSON.parse(localStorage.getItem(STORAGE_KEY_STAMPS));
}

let tKeyCount = 0;
let rKeyCount = 0;
let lastKeyTime = 0;

window.addEventListener('keydown', function(e) {
    const now = Date.now();
    if (now - lastKeyTime > 1000) { tKeyCount = 0; rKeyCount = 0; }
    lastKeyTime = now;
    if (e.key === 't' || e.key === 'T') {
        tKeyCount++; rKeyCount = 0;
        if (tKeyCount === 3) { tKeyCount = 0; toggleAdminMode(); }
    }
    else if (e.key === 'r' || e.key === 'R') {
        rKeyCount++; tKeyCount = 0;
        if (rKeyCount === 3) { rKeyCount = 0; resetChildrenData(); }
    } else { tKeyCount = 0; rKeyCount = 0; }
});

function toggleAdminMode() {
    isAdmin = !isAdmin;
    if (isAdmin) {
        document.body.classList.remove('children-mode');
        document.body.classList.add('admin-mode');
        alert("⚙️ 先生モードを起動しました：マップをタップしてピンを追加できます。");
    } else {
        document.body.classList.remove('admin-mode');
        document.body.classList.add('children-mode');
        closeEditPopup();
        alert("🎒 子どもモード（探検モード）に戻りました。");
    }
    stagePins();
}

function resetChildrenData() {
    if (confirm("🧹 子どもたちが集めたスタンプの記録（黄色マーク）をすべて消去して、灰色に戻しますか？")) {
        localStorage.removeItem(STORAGE_KEY_STAMPS);
        myStamps = [];
        stagePins();
        alert("スタンプの記録をリセットしました！");
    }
}

function stagePins() {
    const container = document.getElementById('stamps-container');
    container.innerHTML = "";
    pinPositions.forEach((pin, index) => {
        const stamp = document.createElement('div');
        stamp.className = 'stamp';
        stamp.style.left = pin.x + '%';
        stamp.style.top = pin.y + '%';
        if (isAdmin) {
            stamp.classList.add('achieved');
            stamp.innerText = pin.id;
            stamp.style.fontSize = '11px'; stamp.style.color = 'black'; stamp.style.fontWeight = 'bold';
            stamp.style.textAlign = 'center'; stamp.style.lineHeight = '32px';
            stamp.addEventListener('click', (e) => { e.stopPropagation(); openEditPopup(index); });
        } else if (myStamps.includes(String(pin.id))) {
            stamp.classList.add('achieved');
            stamp.innerText = "";
            stamp.addEventListener('click', (e) => { e.stopPropagation(); showRoomDetails(pin); });
        } else {
            stamp.innerText = "";
            stamp.style.backgroundColor = "#bdc3c7";
            stamp.style.border = "2px solid #7f8c8d";
            stamp.addEventListener('click', function(e) {
                e.stopPropagation();
                if (this.classList.contains('not-found-animate')) return;
                playNotFoundSound();
                this.classList.add('not-found-animate');
                setTimeout(() => { this.classList.remove('not-found-animate'); }, 400);
            });
        }
        container.appendChild(stamp);
    });
}

// 💡 修正：自動で閉じる処理（setTimeout）を完全に削除
function showRoomDetails(pin) {
    const imgEl = document.getElementById('modal-image');
    imgEl.src = `${pin.id}.jpg`;
    imgEl.onerror = function() {
        if (this.src.endsWith('.jpg')) { this.src = `${pin.id}.JPG`; } 
        else if (this.src.endsWith('.JPG')) { this.src = `${pin.id}.png`; } 
        else { this.src = 'map.png'; this.onerror = null; }
    };
    document.getElementById('room-modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('room-modal').style.display = 'none';
}

let videoStream = null;
let isScanning = false;
let lastCode = "";
let lastTime = 0;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playAchievedSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    osc1.connect(gain1); gain1.connect(audioCtx.destination);
    osc1.type = 'sine'; osc1.frequency.setValueAtTime(880, now);
    gain1.gain.setValueAtTime(0.3, now);
    gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc1.start(now); osc1.stop(now + 0.1);
    const osc2 = audioCtx.createOscillator();
    const gain2 = audioCtx.createGain();
    osc2.connect(gain2); gain2.connect(audioCtx.destination);
    osc2.type = 'sine'; osc2.frequency.setValueAtTime(1318.51, now + 0.1);
    gain2.gain.setValueAtTime(0.3, now + 0.1);
    gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
    osc2.start(now + 0.1); osc2.stop(now + 0.3);
}

function playNotFoundSound() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = originGain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now);
    osc.frequency.rampToValueAtTime(330, now + 0.1);
    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
    osc.start(); osc.stop(now + 0.1);
}

function startCamera(e) {
    if (e && e.cancelable) e.preventDefault(); 
    if (isScanning) return; 
    const video = document.getElementById('webcam-video');
    document.getElementById('camera-container').style.display = 'flex';
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => { videoStream = stream; video.srcObject = stream; isScanning = true; requestAnimationFrame(tick); })
    .catch(err => { console.error("カメラエラー:", err); stopCamera(); });
}

function stopCamera(e) {
    if (e && e.cancelable) e.preventDefault();
    if (!isScanning) return;
    isScanning = false;
    document.getElementById('camera-container').style.display = 'none';
    if (videoStream) { videoStream.getTracks().forEach(track => track.stop()); videoStream = null; }
}

function tick() {
    if (!isScanning) return;
    const video = document.getElementById('webcam-video');
    const canvas = document.getElementById('qr-canvas');
    const context = canvas.getContext('2d', { willReadFrequently: true });
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight; canvas.width = video.videoWidth;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code) {
            const now = Date.now();
            if (code.data !== lastCode || now - lastTime > 800) { lastCode = code.data; lastTime = now; handleScanResult(code.data); }
        }
    }
    requestAnimationFrame(tick);
}

function shootConfetti() {
    confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#FFD700', '#FF6347', '#32CD32', '#1E90FF', '#BA55D3']
    });
}

function handleScanResult(qrValue) {
    if (qrValue.startsWith("SET:")) {
        playAchievedSound();
        shootConfetti();
        const dataStr = qrValue.replace("SET:", "");
        pinPositions = JSON.parse(dataStr);
        localStorage.setItem(STORAGE_KEY_PINS, JSON.stringify(pinPositions)); 
        stopCamera(); 
        stagePins();
        return;
    }
    
    const hitPin = pinPositions.find(p => String(p.id) === String(qrValue));
    if (hitPin) {
        if (!myStamps.includes(String(qrValue))) {
            playAchievedSound(); 
            shootConfetti();
            myStamps.push(String(qrValue));
            localStorage.setItem(STORAGE_KEY_STAMPS, JSON.stringify(myStamps));
        }
        stopCamera(); 
        stagePins();
        showRoomDetails(hitPin); 
    }
}

document.getElementById('map-image').addEventListener('click', function(e) {
    if (!isAdmin) return;
    const rect = this.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;
    const percentX = (clickX / rect.width) * 100;
    const percentY = (clickY / rect.height) * 100;
    
    let targetId = 101;
    const currentIds = pinPositions.map(p => parseInt(p.id));
    while (currentIds.includes(targetId)) { targetId++; }
    
    pinPositions.push({ id: String(targetId), x: Math.round(percentX * 100) / 100, y: Math.round(percentY * 100) / 100 });
    pinPositions.sort((a, b) => parseInt(a.id) - parseInt(b.id));
    stagePins();
});

function openEditPopup(index) {
    selectedPinIndex = index;
    const pin = pinPositions[index];
    document.getElementById('edit-popup-title').innerText = `ピンの確認`;
    document.getElementById('edit-popup-info').innerText = `QR番号: ${pin.id}`;
    document.getElementById('admin-edit-popup').style.display = 'block';
}

function closeEditPopup() { document.getElementById('admin-edit-popup').style.display = 'none'; selectedPinIndex = null; }

function deletePin() {
    if (selectedPinIndex === null) return;
    if (confirm("このピンを削除してもよろしいですか？")) {
        pinPositions.splice(selectedPinIndex, 1);
        stagePins();
        alert("ピンを削除しました。");
    }
    closeEditPopup();
}

function generateAdminQR() {
    if (pinPositions.length === 0) { alert("ピンがありません"); return; }
    try {
        const qrCanvas = document.getElementById('qrcode-canvas');
        qrCanvas.innerHTML = ""; 
        const qrData = "SET:" + JSON.stringify(pinPositions);
        const qr = qrcode(0, 'L');
        qr.addData(qrData); qr.make();
        qrCanvas.innerHTML = qr.createImgTag(5);
        document.getElementById('qrcode-popup').style.display = 'block';
    } catch (e) { alert("QRコードの生成に失敗しました。"); }
}

function closeQRPopup() { document.getElementById('qrcode-popup').style.display = 'none'; }

window.addEventListener('resize', stagePins);

stagePins();
</script>
</body>
</html>
