<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>QR校内探検マップ</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
}

#map-wrapper {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    max-width: 100vw;
    max-height: 100vh;
}

#map-area {
    position: relative;
    display: inline-block;
}

#map-image {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    object-fit: contain;
    cursor: pointer;
}

/* 📍 ピンの土台：マップのタップを邪魔しないよう配置 */
#stamps-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* これにより下の画像へのタップが貫通します */
}

.stamp {
    position: absolute;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    transition: transform 0.1s;
    pointer-events: auto; /* ピン自体はしっかりタップできるようにする */
    z-index: 10;
}
.stamp:active { transform: translate(-50%, -50%) scale(0.9); }

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background-color:rgba(0,0,0,0.8);z-index:200;justify-content:center;align-items:center;flex-direction:column;color:white;}
.modal img{max-width:80%;max-height:70%;border:5px solid white;border-radius:10px;object-fit:contain;}
.modal h2{margin-top:15px;font-size:24px;}
.close-btn{margin-top:15px;padding:10px 20px;background-color:#ff6666;color:white;border:none;border-radius:50px;font-size:18px;cursor:pointer;}
#admin-toggle{position:fixed;left:10px;bottom:10px;background:rgba(0,0,0,0.6);color:white;border:none;padding:8px 12px;border-radius:5px;font-size:12px;z-index:150;cursor:pointer;}

#camera-container{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:300;flex-direction:column;justify-content:center;align-items:center;}
#webcam-video{width:100%;height:80%;object-fit:cover;}
#camera-close-btn{position:fixed;bottom:30px;padding:15px 30px;background:#ff6666;color:white;border:none;border-radius:50px;font-size:20px;font-weight:bold;cursor:pointer;z-index:310;}

#qrcode-popup{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;padding:25px;border-radius:15px;box-shadow:0 0 30px rgba(0,0,0,0.5);z-index:400;text-align:center;color:black;width:85%;max-width:320px;}
#qrcode-canvas img { max-width: 100%; height: auto; margin: 15px auto; display: block; }

.admin-edit-popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
    z-index: 500;
    text-align: center;
    color: black;
    width: 280px;
}
.admin-edit-popup button {
    margin: 6px;
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    width: 80%;
    font-size: 14px;
}
</style>
</head>
<body class="children-mode">

<div id="map-wrapper">
    <div id="map-area">
        <img id="map-image" src="map.png" alt="校内マップ" onerror="this.style.display='none'; alert('map.png が見つかりません。');">
        <div id="stamps-container"></div>
    </div>
</div>

<button id="camera-button" onclick="startCamera()">カ<br>メ<br>ラ</button>
<button id="admin-toggle" onclick="toggleAdminMode()">⚙️ 先生モード</button>

<div id="camera-container">
    <video id="webcam-video" autoplay playsinline></video>
    <button id="camera-close-btn" onclick="stopCamera()">もどる</button>
    <canvas id="qr-canvas" hidden></canvas>
</div>

<div id="admin-panel">
<h3>【先生用】設定モード</h3>
<p>①マップをタップしてピンを配置 ➡️ ②右のボタンを押す</p>
<button id="save-settings-btn" onclick="generateAdminQR()">📱 配布用マスターQRコードを作る</button>
</div>

<div id="qrcode-popup">
    <h3>子どもたちに読み込ませるQRコード</h3>
    <p style="font-size:13px; color:#555;">このQRを児童のカメラで読み取ると、マップのピンが一瞬で復元します！</p>
    <div id="qrcode-canvas"></div>
    <button class="close-btn" style="background:#444;" onclick="closeQRPopup()">とじる</button>
</div>

<div id="admin-edit-popup" class="admin-edit-popup">
    <h3 id="edit-popup-title">ピンの確認</h3>
    <p id="edit-popup-info" style="font-weight:bold; color:#2c3e50; font-size:18px;"></p>
    <p style="font-size:12px; color:#7f8c8d;">この教室の写真は「（上の番号）.jpg」という名前でGitHubに保存してください。</p>
    <button onclick="deletePin()" style="background:#e74c3c; color:white;">このピンを削除する</button><br>
    <button onclick="closeEditPopup()" style="background:#7f8c8d; color:white;">とじる</button>
</div>

<div id="room-modal" class="modal" onclick="closeModal()">
<img id="modal-image" src="" alt="教室の様子">
<h2 id="modal-title">みつけたよ！</h2>
<button class="close-btn">とじる</button>
</div>

<script>
let isAdmin = false;
let pinPositions = [];
let myStamps = [];
let selectedPinIndex = null;

const STORAGE_KEY_PINS = 'school_qr_pins';
const STORAGE_KEY_STAMPS = 'school_qr_stamps';

if (localStorage.getItem(STORAGE_KEY_PINS)) {
    pinPositions = JSON.parse(localStorage.getItem(STORAGE_KEY_PINS));
}
if (localStorage.getItem(STORAGE_KEY_STAMPS)) {
    myStamps = JSON.parse(localStorage.getItem(STORAGE_KEY_STAMPS));
}

function stagePins() {
    const container = document.getElementById('stamps-container');
    container.innerHTML = "";
    
    pinPositions.forEach((pin, index) => {
        const stamp = document.createElement('div');
        stamp.className = 'stamp';
        stamp.style.left = pin.x + '%';
        stamp.style.top = pin.y + '%';
        
        if (isAdmin) {
            stamp.classList.add('achieved');
            stamp.innerText = pin.id;
            stamp.style.fontSize = '11px';
            stamp.style.color = 'black';
            stamp.style.fontWeight = 'bold';
            stamp.style.textAlign = 'center';
            stamp.style.lineHeight = '32px';
            stamp.addEventListener('click', (e) => {
                e.stopPropagation();
                openEditPopup(index);
            });
        } else if (myStamps.includes(String(pin.id))) {
            stamp.classList.add('achieved');
            stamp.innerText = "";
            stamp.addEventListener('click', (e) => {
                e.stopPropagation();
                showRoomDetails(pin);
            });
        } else {
            stamp.innerText = "";
            stamp.style.backgroundColor = "#bdc3c7";
            stamp.style.border = "2px solid #7f8c8d";
            stamp.addEventListener('click', (e) => {
                e.stopPropagation();
                alert("ここは まだ見つけていないよ！校内を探してQRコードを見つけよう！");
            });
        }
        container.appendChild(stamp);
    });
}

function showRoomDetails(pin) {
    const imgEl = document.getElementById('modal-image');
    imgEl.src = `${pin.id}.jpg`;
    imgEl.onerror = function() {
        if (this.src.endsWith('.jpg')) { this.src = `${pin.id}.JPG`; } 
        else if (this.src.endsWith('.JPG')) { this.src = `${pin.id}.png`; } 
        else { this.src = 'map.png'; this.onerror = null; }
    };
    document.getElementById('room-modal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('room-modal').style.display = 'none';
}

// === 📸 QR読取ロジック ===
let videoStream = null;
let isScanning = false;
let lastCode = "";
let lastTime = 0;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

function startCamera() {
    const video = document.getElementById('webcam-video');
    document.getElementById('camera-container').style.display = 'flex';
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => {
        videoStream = stream;
        video.srcObject = stream;
        isScanning = true;
        requestAnimationFrame(tick);
    })
    .catch(err => {
        alert("カメラが起動できませんでした。");
        stopCamera();
    });
}

function stopCamera() {
    isScanning = false;
    document.getElementById('camera-container').style.display = 'none';
    if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
    }
}

function tick() {
    if (!isScanning) return;
    const video = document.getElementById('webcam-video');
    const canvas = document.getElementById('qr-canvas');
    const context = canvas.getContext('2d', { willReadFrequently: true });
    
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        
        if (code) {
            const now = Date.now();
            if (code.data !== lastCode || now - lastTime > 800) {
                lastCode = code.data;
                lastTime = now;
                handleScanResult(code.data);
            }
        }
    }
    requestAnimationFrame(tick);
}

function handleScanResult(qrValue) {
    // 💡 修正：マスターQR読み込み後は、文字を出さずに「すぐにマップを表示」
    if (qrValue.startsWith("SET:")) {
        playBeep();
        const dataStr = qrValue.replace("SET:", "");
        pinPositions = JSON.parse(dataStr);
        localStorage.setItem(STORAGE_KEY_PINS, JSON.stringify(pinPositions)); 
        stopCamera(); // カメラをすぐに閉じる
        stagePins();  // マップに即反映
        return;
    }
    
    const hitPin = pinPositions.find(p => String(p.id) === String(qrValue));
    if (hitPin) {
        playBeep();
        if (!myStamps.includes(String(qrValue))) {
            myStamps.push(String(qrValue));
            localStorage.setItem(STORAGE_KEY_STAMPS, JSON.stringify(myStamps));
        }
        stopCamera(); // カメラをすぐに閉じる
        stagePins();  // マップを更新
        
        // 💡 修正：教室QR読み込み後、すぐにピンを押したときの画面（教室の画像）を表示
        showRoomDetails(hitPin);
    }
}

function toggleAdminMode() {
    isAdmin = !isAdmin;
    if (isAdmin) {
        document.body.classList.remove('children-mode');
        document.body.classList.add('admin-mode');
    } else {
        document.body.classList.remove('admin-mode');
        document.body.classList.add('children-mode');
        closeEditPopup();
    }
    stagePins();
}

// 💡 修正：マップ画像のタップ判定を100%確実に拾える構造へ修正
document.getElementById('map-image').addEventListener('click', function(e) {
    if (!isAdmin) return;
    
    const rect = this.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const clickY = e.clientY - rect.top;
    
    const percentX = (clickX / rect.width) * 100;
    const percentY = (clickY / rect.height) * 100;
    
    let targetId = 101;
    const currentIds = pinPositions.map(p => parseInt(p.id));
    while (currentIds.includes(targetId)) {
        targetId++;
    }
    
    pinPositions.push({ 
        id: String(targetId), 
        x: Math.round(percentX * 100) / 100, 
        y: Math.round(percentY * 100) / 100 
    });
    pinPositions.sort((a, b) => parseInt(a.id) - parseInt(b.id));
    
    // 即時反映
    stagePins();
});

function openEditPopup(index) {
    selectedPinIndex = index;
    const pin = pinPositions[index];
    document.getElementById('edit-popup-title').innerText = `ピンの確認`;
    document.getElementById('edit-popup-info').innerText = `QR番号: ${pin.id}`;
    document.getElementById('admin-edit-popup').style.display = 'block';
}

function closeEditPopup() {
    document.getElementById('admin-edit-popup').style.display = 'none';
    selectedPinIndex = null;
}

function deletePin() {
    if (selectedPinIndex === null) return;
    if (confirm("このピンを削除してもよろしいですか？")) {
        pinPositions.splice(selectedPinIndex, 1);
        stagePins();
        alert("ピンを削除しました。");
    }
    closeEditPopup();
}

function generateAdminQR() {
    if (pinPositions.length === 0) { alert("ピンがありません"); return; }
    try {
        const qrCanvas = document.getElementById('qrcode-canvas');
        qrCanvas.innerHTML = ""; 
        const qrData = "SET:" + JSON.stringify(pinPositions);
        const qr = qrcode(0, 'L');
        qr.addData(qrData);
        qr.make();
        qrCanvas.innerHTML = qr.createImgTag(5);
        document.getElementById('qrcode-popup').style.display = 'block';
    } catch (e) {
        alert("QRコードの生成に失敗しました。");
    }
}

function closeQRPopup() { document.getElementById('qrcode-popup').style.display = 'none'; }

window.addEventListener('resize', stagePins);

stagePins();
</script>
</body>
</html>
